name: build and deploy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: cryoem-book
          cache-environment: true
      - uses: actions/configure-pages@v6
      - name: Register notebook kernel
        shell: micromamba-shell {0}
        run: python -m ipykernel install --user --name cryoem-book --display-name "Python (cryoem-book)"
      - name: Full reproducible build
        shell: micromamba-shell {0}
        run: make build-full CONDA_RUN=
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
